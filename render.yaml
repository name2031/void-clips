services:
  - type: web
    name: void-clips
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node server/index.js
    envVars:
      - key: PUBLIC_MODE
        value: "1"
      - key: PORT
        value: "8787"
      - key: NODE_VERSION
        value: "20"
